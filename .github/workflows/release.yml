name: Build and Release ReClip

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Flask pywebview pyinstaller yt-dlp requests psutil

      - name: Prepare binaries (FFmpeg & yt-dlp)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin
          
          # Locate preinstalled ffmpeg or install via choco
          $ffmpegCmd = Get-Command ffmpeg -ErrorAction SilentlyContinue
          if ($ffmpegCmd) {
            Write-Host "Found pre-installed ffmpeg: $($ffmpegCmd.Source)"
            Copy-Item -Path $ffmpegCmd.Source -Destination "bin\ffmpeg.exe" -Force
          } else {
            Write-Host "Installing ffmpeg via chocolatey..."
            choco install ffmpeg -y
            Copy-Item -Path "C:\ProgramData\chocolatey\bin\ffmpeg.exe" -Destination "bin\ffmpeg.exe" -Force
          }
          
          # Download latest yt-dlp.exe using curl
          Write-Host "Downloading yt-dlp.exe..."
          curl.exe -L "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -o "bin\yt-dlp.exe"

      - name: Build Desktop Executable with PyInstaller
        run: |
          python build_windows_app.py

      - name: Compile Windows Installer with Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload Setup Binary to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $setupFile = Get-ChildItem -Path "." -Filter "ReClip_*_Setup.exe" | Select-Object -First 1
          if ($setupFile) {
            Write-Host "Uploading $($setupFile.FullName) to release v1.2.0..."
            gh release upload v1.2.0 $setupFile.FullName --clobber
          } else {
            Write-Error "Setup file not found!"
          }
