name: Build and Release ReClip

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Flask pywebview pyinstaller yt-dlp requests psutil

      - name: Prepare binaries (FFmpeg & yt-dlp)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin
          
          # Download standalone static ffmpeg.exe if not present
          if (-not (Test-Path "bin\ffmpeg.exe")) {
            Invoke-WebRequest -Uri "https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
            Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted"
            $ffmpegFile = Get-ChildItem -Path "ffmpeg_extracted" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
            Copy-Item -Path $ffmpegFile.FullName -Destination "bin\ffmpeg.exe" -Force
          }
          
          # Download latest yt-dlp.exe
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "bin\yt-dlp.exe" -Force

      - name: Build Desktop Executable with PyInstaller
        run: |
          python build_windows_app.py

      - name: Compile Windows Installer with Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload Setup Binary to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $setupFile = Get-ChildItem -Path "." -Filter "ReClip_*_Setup.exe" | Select-Object -First 1
          if ($setupFile) {
            Write-Host "Uploading $($setupFile.FullName) to release v1.2.0..."
            gh release upload v1.2.0 $setupFile.FullName --clobber
          } else {
            Write-Error "Setup file not found!"
          }
